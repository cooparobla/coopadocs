[project]
name = "coopadocs"
version = "0.1.0"
description = "Uniform Python and C++ Documentation Generator CLI"
readme = "README.md"
authors = [
    { email = "cooparobla@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "jinja2>=3.1.6",
    "markdown>=3.10.3",
    "pygments>=2.20.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
coopadocs = "coopadocs.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
